{% extends "base.html" %}
{% block title %}Register - EduSupport{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card shadow-sm">
<div class="card-body p-4">
<h2 class="text-center mb-4">Student Registration</h2>

<form method="POST">
    <label class="form-label">Name</label>
    <input class="form-control mb-3" name="name" required>

    <label class="form-label">Email</label>
    <input class="form-control mb-3" type="email" name="email" required>

    <label class="form-label">Password</label>
    <input class="form-control mb-3" type="password" name="password" minlength="6" required>

    <button class="btn btn-success w-100">Register</button>
</form>

<p class="text-center mt-3">
    Already registered? <a href="{{ url_for('auth.login') }}">Login</a>
</p>
</div>
</div>
</div>
</div>
{% endblock %}
